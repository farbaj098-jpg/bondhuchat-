<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বন্ধু Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f5;color:#17201a}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff}header{background:#16834b;color:#fff;padding:18px;font-size:23px;font-weight:700}.screen{display:none;padding:18px;padding-bottom:90px}.screen.active{display:block}input,select{width:100%;padding:14px;border:1px solid #ccd5ce;border-radius:12px;margin:8px 0;font-size:16px;background:#fff}button{border:0;border-radius:12px;padding:13px 17px;background:#16834b;color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.primary{width:100%;margin-top:12px}.phoneRow{display:flex;gap:7px}.country{width:125px}.phoneInput{flex:1}#otpBox{display:none;margin-top:15px}.small{text-align:center;color:#68736c;font-size:13px;margin-top:10px}.person{display:flex;align-items:center;padding:15px 5px;border-bottom:1px solid #eee;cursor:pointer}.avatar{font-size:34px;margin-right:12px}.meta{flex:1}.name{font-weight:700}.last{color:#657169;font-size:14px}.msgs{height:52vh;overflow:auto;padding:10px 0}.bubble{padding:10px 13px;margin:8px 0;border-radius:15px;background:#edf1ee;max-width:78%;width:max-content}.me{margin-left:auto;background:#d8f2e3}.composer{display:flex;gap:7px}.composer input{margin:0}.composer button{padding:10px}.back{background:none;color:#16834b;padding:0;margin-bottom:12px}.callButtons{display:flex;gap:8px;margin:10px 0}.callButtons button{flex:1}.videoBtn{background:#1976d2}.endBtn{background:#d32f2f}#callScreen{display:none;position:fixed;inset:0;z-index:9999;background:#111;color:white}#remoteVideo{width:100%;height:100%;object-fit:cover;background:#222}#localVideo{display:none;position:absolute;top:15px;right:15px;width:110px;height:150px;object-fit:cover;background:#333;border:2px solid white;border-radius:12px;z-index:2}#callTitle{position:absolute;top:15px;left:15px;z-index:3;background:rgba(0,0,0,.6);padding:9px 12px;border-radius:10px}#callControls{position:absolute;bottom:25px;left:0;right:0;text-align:center;z-index:3}#incoming{display:none;position:fixed;left:15px;right:15px;bottom:80px;z-index:10000;background:white;color:#17201a;border-radius:18px;padding:20px;box-shadow:0 5px 30px rgba(0,0,0,.3);text-align:center}nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid #ddd;z-index:100}nav button{flex:1;background:white;color:#555;border-radius:0}
</style>
</head>
<body>
<div class="app">
<header>💬 বন্ধু Chat</header>
<section id="login" class="screen active">
<h2>স্বাগতম 👋</h2><p>📱 ফোন নম্বর দিয়ে Login / Registration করুন</p>
<div class="phoneRow"><select id="countryCode" class="country"><option value="+880">🇧🇩 +880</option><option value="+91">🇮🇳 +91</option><option value="+92">🇵🇰 +92</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option></select><input id="phone" class="phoneInput" type="tel" placeholder="017XXXXXXXX" autocomplete="tel"></div>
<button id="sendOtpBtn" class="primary">📨 OTP পাঠান</button>
<div id="otpBox"><h3>🔐 OTP যাচাই করুন</h3><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="৬ সংখ্যার OTP লিখুন"><button id="verifyOtpBtn" class="primary">✅ OTP যাচাই করুন</button></div>
<p id="status" class="small"></p>
</section>
<section id="home" class="screen"><h2>💬 Chats</h2><div id="friendList"></div></section>
<section id="friends" class="screen"><h2>👥 Friends</h2><p>বন্ধুর ফোন নম্বর লিখুন</p><div class="phoneRow"><select id="friendCountry" class="country"><option value="+880">🇧🇩 +880</option><option value="+91">🇮🇳 +91</option><option value="+92">🇵🇰 +92</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option></select><input id="friendPhone" class="phoneInput" type="tel" placeholder="017XXXXXXXX"></div><button id="addFriendBtn" class="primary">➕ বন্ধু যোগ করুন</button><p id="friendStatus" class="small"></p></section>
<section id="chat" class="screen"><button class="back" id="backHomeBtn">← ফিরে যান</button><h2 id="chatName">Chat</h2><div class="callButtons"><button id="audioCallBtn">📞 Audio Call</button><button id="videoCallBtn" class="videoBtn">📹 Video Call</button></div><div id="messages" class="msgs"></div><div class="composer"><input id="messageInput" placeholder="মেসেজ লিখুন..."><button id="sendMessageBtn">➤</button></div></section>
<section id="profile" class="screen"><h2>⚙️ Profile</h2><div style="font-size:70px">👤</div><p id="profilePhone"></p><button id="logoutBtn">Logout</button></section>
<nav id="nav"><button id="navHome">💬<br>Chats</button><button id="navFriends">👥<br>Friends</button><button id="navProfile">⚙️<br>Profile</button></nav>
</div>
<div id="callScreen"><div id="callTitle">📞 কল চলছে...</div><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video><div id="callControls"><button id="endCallBtn" class="endBtn">❌ কল কেটে দিন</button></div></div>
<div id="incoming"><h3 id="incomingTitle">📞 Incoming Call</h3><p id="incomingText">আপনার কাছে একটি কল এসেছে</p><button id="acceptCallBtn">✅ ধরুন</button> <button id="rejectCallBtn" class="endBtn">❌ বাতিল</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,getDocs,addDoc,query,where,orderBy,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getDatabase,ref,set,get,update,remove,push,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBORmFMm2HyVu43Z62e0n-RiULlhMZeEaA",authDomain:"bondhu-chat-345f4.firebaseapp.com",databaseURL:"https://bondhu-chat-345f4-default-rtdb.firebaseio.com",projectId:"bondhu-chat-345f4",storageBucket:"bondhu-chat-345f4.firebasestorage.app",messagingSenderId:"232168856296",appId:"1:232168856296:web:3d66036d1185ea3b4e075d"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),rtdb=getDatabase(app);
let currentUser=null,currentFriend=null,confirmationResult=null,messagesUnsubscribe=null,recaptchaVerifier=null;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");$("nav").style.display=id==="login"||id==="chat"?"none":"flex"}
function createRecaptcha(){if(recaptchaVerifier){try{recaptchaVerifier.clear()}catch(e){}}recaptchaVerifier=new RecaptchaVerifier(auth,"sendOtpBtn",{size:"invisible"})}
createRecaptcha();
async function sendOTP(){let n=$("phone").value.trim(),c=$("countryCode").value;if(!n){$("status").textContent="❌ ফোন নম্বর লিখুন";return}if(n.startsWith("0"))n=n.substring(1);n=n.replace(/\D/g,"");if(!n){$("status").textContent="❌ সঠিক ফোন নম্বর দিন";return}$("sendOtpBtn").disabled=true;$("status").textContent="📨 OTP পাঠানো হচ্ছে...";try{if(!recaptchaVerifier)createRecaptcha();confirmationResult=await signInWithPhoneNumber(auth,c+n,recaptchaVerifier);$("otpBox").style.display="block";$("status").textContent="✅ OTP আপনার ফোনে পাঠানো হয়েছে"}catch(e){$("sendOtpBtn").disabled=false;$("status").textContent="❌ OTP পাঠানো যায়নি: "+(e.message||"");try{createRecaptcha()}catch(x){}}}
async function verifyOTP(){const o=$("otp").value.trim();if(!o||!confirmationResult){$("status").textContent="❌ আগে OTP পাঠান";return}$("verifyOtpBtn").disabled=true;try{await confirmationResult.confirm(o);$("status").textContent="✅ Login সফল হয়েছে"}catch(e){$("verifyOtpBtn").disabled=false;$("status").textContent="❌ OTP ভুল অথবা মেয়াদ শেষ হয়েছে"}}
onAuthStateChanged(auth,async u=>{if(u){currentUser=u;await saveUser();$("profilePhone").textContent="📱 "+(u.phoneNumber||"");show("home");await loadFriends()}else{currentUser=null;show("login")}});
async function saveUser(){if(!currentUser?.phoneNumber)return;await setDoc(doc(db,"users",currentUser.uid),{uid:currentUser.uid,phone:currentUser.phoneNumber,updatedAt:serverTimestamp()},{merge:true})}
async function addFriend(){if(!currentUser)return;let n=$("friendPhone").value.trim(),c=$("friendCountry").value;if(n.startsWith("0"))n=n.substring(1);n=n.replace(/\D/g,"");const p=c+n;if(p===currentUser.phoneNumber){$("friendStatus").textContent="❌ নিজেকে বন্ধু করা যাবে না";return}try{const s=await getDocs(query(collection(db,"users"),where("phone","==",p)));if(s.empty){$("friendStatus").textContent="❌ Account পাওয়া যায়নি";return}const f=s.docs[0].data();await setDoc(doc(db,"users",currentUser.uid,"friends",f.uid),{uid:f.uid,phone:f.phone,addedAt:serverTimestamp()});await setDoc(doc(db,"users",f.uid,"friends",currentUser.uid),{uid:currentUser.uid,phone:currentUser.phoneNumber,addedAt:serverTimestamp()});$("friendStatus").textContent="✅ বন্ধু সফলভাবে যোগ হয়েছে";$("friendPhone").value="";loadFriends()}catch(e){$("friendStatus").textContent="❌ বন্ধু যোগ করা যায়নি"}}
async function loadFriends(){if(!currentUser)return;const l=$("friendList");l.innerHTML="";try{const s=await getDocs(collection(db,"users",currentUser.uid,"friends"));if(s.empty){l.innerHTML="<p>এখনও কোনো বন্ধু নেই।</p>";return}s.forEach(d=>{const f=d.data(),v=document.createElement("div");v.className="person";v.innerHTML=`<div class="avatar">👤</div><div class="meta"><div class="name">📱 ${safe(f.phone)}</div><div class="last">Chat করতে চাপুন</div></div>`;v.onclick=()=>openChat(f);l.appendChild(v)})}catch(e){l.innerHTML="<p>❌ Friends লোড করা যায়নি</p>"}}
function openChat(f){currentFriend=f;$("chatName").textContent="📱 "+f.phone;show("chat");loadMessages()}
function chatId(a,b){return[a,b].sort().join("_")}
function loadMessages(){if(!currentUser||!currentFriend)return;if(messagesUnsubscribe)messagesUnsubscribe();const q=query(collection(db,"chats",chatId(currentUser.uid,currentFriend.uid),"messages"),orderBy("createdAt","asc"));messagesUnsubscribe=onSnapshot(q,s=>{const b=$("messages");b.innerHTML="";s.forEach(d=>{const m=d.data(),v=document.createElement("div");v.className=m.sender===currentUser.uid?"bubble me":"bubble";v.textContent=m.text||"";b.appendChild(v)});b.scrollTop=b.scrollHeight})}
async function sendMessage(){if(!currentUser||!currentFriend)return;const i=$("messageInput"),t=i.value.trim();if(!t)return;try{await addDoc(collection(db,"chats",chatId(currentUser.uid,currentFriend.uid),"messages"),{sender:currentUser.uid,receiver:currentFriend.uid,text:t,createdAt:serverTimestamp()});i.value=""}catch(e){alert("❌ মেসেজ পাঠানো যায়নি")}}
async function logout(){await signOut(auth)}
function safe(t){return String(t||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
$("sendOtpBtn").onclick=sendOTP;$("verifyOtpBtn").onclick=verifyOTP;$("addFriendBtn").onclick=addFriend;$("sendMessageBtn").onclick=sendMessage;$("messageInput").onkeydown=e=>{if(e.key==="Enter")sendMessage()};$("logoutBtn").onclick=logout;$("backHomeBtn").onclick=()=>{show("home");loadFriends()};$("navHome").onclick=()=>{show("home");loadFriends()};$("navFriends").onclick=()=>show("friends");$("navProfile").onclick=()=>show("profile");
</script>
</body>
</html>
